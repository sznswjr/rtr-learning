<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="使用浮点 HDR 缓冲比较曝光、色调映射和显示编码。" />
    <title>Chapter 8 光与颜色 | RTR4 实时图形实验</title>
    <link rel="stylesheet" href="../src/styles.css?v=20260803-5" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <main class="app-shell" id="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Real-Time Rendering 4th</p>
          <h1>Chapter 8 光与颜色</h1>
        </div>
        <div class="topbar-actions">
          <a class="status-pill nav-pill" href="../index.html">实验首页</a>
          <a class="status-pill nav-pill" href="../translations/rtr4-cn.html#chapter-8">阅读本章</a>
        </div>
      </header>

      <nav class="chapter-nav" data-chapter="8" aria-label="章节实验导航"></nav>

      <section class="experiment-section" id="hdr-display" aria-label="HDR 曝光与色调映射实验">
        <div class="section-heading">
          <p class="eyebrow">Chapter 8</p>
          <h2>HDR、曝光与色调映射</h2>
        </div>

        <div class="lab-layout">
          <aside class="controls" aria-label="HDR 显示控制">
            <div class="control-group">
              <label for="hdrToneMap">色调映射</label>
              <select id="hdrToneMap">
                <option value="clip">直接裁剪</option>
                <option value="reinhard">Reinhard</option>
                <option value="aces" selected>ACES 近似</option>
              </select>
            </div>

            <div class="control-group">
              <label for="hdrExposure">曝光补偿</label>
              <input id="hdrExposure" type="range" min="-16" max="16" value="0" step="1" />
              <output id="hdrExposureValue" for="hdrExposure">+0.00 EV</output>
            </div>

            <div class="control-group">
              <label for="hdrWhitePoint">场景白点</label>
              <input id="hdrWhitePoint" type="range" min="100" max="1600" value="800" step="50" />
              <output id="hdrWhitePointValue" for="hdrWhitePoint">8.0</output>
            </div>

            <div class="control-group">
              <label for="hdrTransfer">显示编码</label>
              <select id="hdrTransfer">
                <option value="srgb" selected>sRGB</option>
                <option value="linear">线性直接输出</option>
              </select>
            </div>

            <div class="control-group">
              <label for="hdrView">观察方式</label>
              <select id="hdrView">
                <option value="final" selected>最终图像</option>
                <option value="false-color">亮度伪彩</option>
              </select>
            </div>

            <div class="metric-panel">
              <div><span>曝光倍率</span><strong id="hdrMultiplier">× 1.00</strong></div>
              <div><span>中灰场景值</span><strong id="hdrMiddleGray">0.180</strong></div>
              <div><span>中灰输出码值</span><strong id="hdrOutputCode">0.552</strong></div>
              <div><span>HDR 缓冲</span><strong>RGBA16F</strong></div>
            </div>
          </aside>

          <section class="single-viewport-grid">
            <article class="viewport-panel">
              <div class="panel-heading">
                <h2>线性 HDR 场景到显示输出</h2>
                <span>场景峰值约为中灰的 128 倍</span>
              </div>
              <canvas class="webgl-lab-canvas hdr-display-canvas" id="hdrDisplayCanvas" width="1280" height="720"></canvas>
              <div class="hdr-stop-strip" aria-label="场景亮度参考">
                <span style="--level: 0.08"><strong>−6 EV</strong><small>暗部</small></span>
                <span style="--level: 0.22"><strong>−2 EV</strong><small>阴影</small></span>
                <span style="--level: 0.48"><strong>0 EV</strong><small>中灰</small></span>
                <span style="--level: 0.76"><strong>+4 EV</strong><small>高光</small></span>
                <span style="--level: 1"><strong>+7 EV</strong><small>峰值</small></span>
              </div>
            </article>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="../src/pages/chapter-8.js?v=20260803-5"></script>
  </body>
</html>

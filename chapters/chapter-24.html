<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="比较光栅、屏幕空间、软件射线和混合渲染路径。" /><title>Chapter 24 未来 | RTR4 实时图形实验</title><link rel="stylesheet" href="../src/styles.css?v=20260803-11" /></head><body>
<a class="skip-link" href="#main-content">跳到主要内容</a><main class="app-shell" id="main-content"><header class="topbar"><div><p class="eyebrow">Real-Time Rendering 4th</p><h1>Chapter 24 未来</h1></div><div class="topbar-actions"><a class="status-pill nav-pill" href="../index.html">实验首页</a><a class="status-pill nav-pill" href="../translations/rtr4-cn.html#chapter-24">阅读本章</a></div></header>
<nav class="chapter-nav" data-chapter="24" aria-label="章节实验导航"></nav><section class="experiment-section" id="hybrid-rendering" aria-label="混合渲染路径实验"><div class="section-heading"><p class="eyebrow">Chapter 24</p><h2>混合渲染路径</h2></div><div class="lab-layout"><aside class="controls" aria-label="混合渲染控制">
<div class="control-group"><label for="hybridMode">反射路径</label><select id="hybridMode"><option value="raster">仅光栅</option><option value="screen">屏幕空间 SSR</option><option value="software">软件射线</option><option value="hybrid" selected>SSR + 射线回退</option></select></div>
<div class="control-group"><label for="hybridSteps">最大步进</label><input id="hybridSteps" type="range" min="8" max="64" value="32" step="4" /><output id="hybridStepsValue" for="hybridSteps">32</output></div>
<div class="control-group"><label for="hybridRays">射线 / 像素</label><input id="hybridRays" type="range" min="1" max="8" value="2" step="1" /><output id="hybridRaysValue" for="hybridRays">2</output></div>
<div class="control-group"><label for="hybridRoughness">表面粗糙度</label><input id="hybridRoughness" type="range" min="2" max="70" value="24" step="2" /><output id="hybridRoughnessValue" for="hybridRoughness">0.24</output></div>
<div class="control-group"><label for="hybridHistory">时间复用</label><input id="hybridHistory" type="range" min="0" max="95" value="78" step="1" /><output id="hybridHistoryValue" for="hybridHistory">78%</output></div>
<div class="metric-panel"><div><span>屏幕空间命中</span><strong id="hybridScreenHits">71%</strong></div><div><span>回退射线</span><strong id="hybridFallback">29%</strong></div><div><span>估算成本</span><strong id="hybridCost">2.8 ms</strong></div><div><span>历史权重</span><strong id="hybridHistoryMetric">0.78</strong></div></div></aside>
<section class="single-viewport-grid"><article class="viewport-panel"><div class="panel-heading"><h2>镜面场景与反射覆盖</h2><span>洋红缺口表示屏幕外信息；青色射线负责回退</span></div><canvas class="webgl-lab-canvas hybrid-canvas" id="hybridCanvas" width="1280" height="720"></canvas><div class="concept-strip hybrid-stage-strip"><span data-mode="raster"><strong>R</strong>光栅主可见性</span><span data-mode="screen"><strong>S</strong>屏幕空间追踪</span><span data-mode="software"><strong>Q</strong>软件射线查询</span><span data-mode="hybrid"><strong>H</strong>分层混合</span></div></article></section></div></section>
</main><script type="module" src="../src/pages/chapter-24.js?v=20260803-10"></script></body></html>

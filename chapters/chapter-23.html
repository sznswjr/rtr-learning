<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="比较访问模式、Overdraw、深度预通过和颜色压缩的显存流量。" /><title>Chapter 23 图形硬件 | RTR4 实时图形实验</title><link rel="stylesheet" href="../src/styles.css?v=20260803-7" /></head><body>
<a class="skip-link" href="#main-content">跳到主要内容</a><main class="app-shell" id="main-content"><header class="topbar"><div><p class="eyebrow">Real-Time Rendering 4th</p><h1>Chapter 23 图形硬件</h1></div><div class="topbar-actions"><a class="status-pill nav-pill" href="../index.html">实验首页</a><a class="status-pill nav-pill" href="../translations/rtr4-cn.html#chapter-23">阅读本章</a></div></header>
<nav class="chapter-nav" data-chapter="23" aria-label="章节实验导航"></nav><section class="experiment-section" id="bandwidth-cache" aria-label="带宽缓存实验"><div class="section-heading"><p class="eyebrow">Chapter 23</p><h2>带宽、缓存与 Overdraw</h2></div><div class="lab-layout"><aside class="controls" aria-label="显存流量控制">
<div class="control-group"><label for="bandwidthPattern">访问策略</label><select id="bandwidthPattern"><option value="coherent">连续 Tile 访问</option><option value="random">随机访问</option><option value="overdraw">直接 Overdraw</option><option value="prepass" selected>深度预通过</option></select></div>
<div class="control-group"><label for="bandwidthTargets">颜色附件</label><input id="bandwidthTargets" type="range" min="1" max="5" value="3" step="1" /><output id="bandwidthTargetsValue" for="bandwidthTargets">3 × RGBA8</output></div>
<div class="control-group"><label for="bandwidthSamples">MSAA 样本</label><input id="bandwidthSamples" type="range" min="1" max="4" value="2" step="1" /><output id="bandwidthSamplesValue" for="bandwidthSamples">2×</output></div>
<div class="control-group"><label for="bandwidthOverdraw">Overdraw</label><input id="bandwidthOverdraw" type="range" min="10" max="60" value="36" step="1" /><output id="bandwidthOverdrawValue" for="bandwidthOverdraw">3.6×</output></div>
<div class="control-group"><label for="bandwidthCompression">颜色压缩率</label><input id="bandwidthCompression" type="range" min="10" max="80" value="42" step="2" /><output id="bandwidthCompressionValue" for="bandwidthCompression">42%</output></div>
<div class="metric-panel"><div><span>写入字节 / px</span><strong id="bandwidthBytes">28.4 B</strong></div><div><span>帧流量</span><strong id="bandwidthFrame">94 MB</strong></div><div><span>缓存命中</span><strong id="bandwidthHitRate">86%</strong></div><div><span>估算带宽</span><strong id="bandwidthRate">11.3 GB/s</strong></div></div></aside>
<section class="single-viewport-grid"><article class="viewport-panel"><div class="panel-heading"><h2>Tile 缓存与帧缓冲写入</h2><span>亮块为当前工作集；暖色轨迹表示重复写入</span></div><canvas class="webgl-lab-canvas bandwidth-canvas" id="bandwidthCanvas" width="1280" height="720"></canvas><div class="concept-strip bandwidth-stage-strip"><span data-pattern="coherent"><strong>C</strong>空间连续</span><span data-pattern="random"><strong>R</strong>随机工作集</span><span data-pattern="overdraw"><strong>O</strong>重复写入</span><span data-pattern="prepass"><strong>Z</strong>Early-Z / 预通过</span></div></article></section></div></section>
</main><script type="module" src="../src/pages/chapter-23.js?v=20260803-7"></script></body></html>

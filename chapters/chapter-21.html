<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="观察双目视差、镜头畸变和注视点渲染。" /><title>Chapter 21 VR 与 AR | RTR4 实时图形实验</title><link rel="stylesheet" href="../src/styles.css?v=20260803-10" /></head><body>
<a class="skip-link" href="#main-content">跳到主要内容</a><main class="app-shell" id="main-content"><header class="topbar"><div><p class="eyebrow">Real-Time Rendering 4th</p><h1>Chapter 21 VR 与 AR</h1></div><div class="topbar-actions"><a class="status-pill nav-pill" href="../index.html">实验首页</a><a class="status-pill nav-pill" href="../translations/rtr4-cn.html#chapter-21">阅读本章</a></div></header>
<nav class="chapter-nav" data-chapter="21" aria-label="章节实验导航"></nav><section class="experiment-section" id="stereo-foveation" aria-label="双目与注视点渲染实验"><div class="section-heading"><p class="eyebrow">Chapter 21</p><h2>双目与注视点渲染</h2></div><div class="lab-layout"><aside class="controls" aria-label="头显渲染控制">
<div class="control-group"><label for="vrViewMode">诊断视图</label><select id="vrViewMode"><option value="stereo">双目视差</option><option value="distortion">镜头畸变</option><option value="foveation">注视点分辨率</option><option value="combined" selected>组合输出</option></select></div>
<div class="control-group"><label for="vrIpd">瞳距 IPD</label><input id="vrIpd" type="range" min="50" max="75" value="64" step="1" /><output id="vrIpdValue" for="vrIpd">64 mm</output></div>
<div class="control-group"><label for="vrDistortion">畸变系数 k₁</label><input id="vrDistortion" type="range" min="0" max="45" value="24" step="1" /><output id="vrDistortionValue" for="vrDistortion">0.24</output></div>
<div class="control-group"><label for="vrGazeX">注视点 X</label><input id="vrGazeX" type="range" min="-70" max="70" value="18" step="2" /><output id="vrGazeXValue" for="vrGazeX">+0.18</output></div>
<div class="control-group"><label for="vrFovea">中央清晰半径</label><input id="vrFovea" type="range" min="12" max="42" value="24" step="1" /><output id="vrFoveaValue" for="vrFovea">24%</output></div>
<div class="metric-panel"><div><span>近物体视差</span><strong id="vrDisparity">3.8°</strong></div><div><span>边缘采样率</span><strong id="vrPeripheral">35%</strong></div><div><span>像素节省</span><strong id="vrSavings">41%</strong></div><div><span>双眼视图</span><strong>2</strong></div></div></aside>
<section class="single-viewport-grid"><article class="viewport-panel"><div class="panel-heading"><h2>左右眼镜头输出</h2><span>十字为注视点；同心环表示采样率分区</span></div><canvas class="webgl-lab-canvas stereo-canvas" id="stereoCanvas" width="1280" height="720"></canvas><div class="concept-strip vr-stage-strip"><span data-mode="stereo"><strong>S</strong>眼位视差</span><span data-mode="distortion"><strong>D</strong>反向镜头畸变</span><span data-mode="foveation"><strong>F</strong>注视点采样</span><span data-mode="combined"><strong>C</strong>组合输出</span></div></article></section></div></section>
</main><script type="module" src="../src/pages/chapter-21.js?v=20260803-10"></script></body></html>

<nav class="chapter-nav" data-chapter="18" aria-label="章节实验导航"></nav><section class="experiment-section" id="gpu-bottleneck" aria-label="GPU 瓶颈诊断实验"><div class="section-heading"><p class="eyebrow">Chapter 18</p><h2>GPU 瓶颈诊断台</h2></div>
<div class="lab-layout"><aside class="controls" aria-label="管线负载控制">
<div class="control-group"><label for="bottleneckPreset">诊断场景</label><select id="bottleneckPreset"><option value="balanced" selected>均衡帧</option><option value="submission">提交受限</option><option value="geometry">几何受限</option><option value="fragment">片元受限</option><option value="bandwidth">带宽受限</option></select></div>
<div class="control-group"><label for="bottleneckDraws">Draw Calls</label><input id="bottleneckDraws" type="range" min="100" max="2400" value="620" step="20" /><output id="bottleneckDrawsValue" for="bottleneckDraws">620</output></div>
<div class="control-group"><label for="bottleneckTriangles">三角形数量</label><input id="bottleneckTriangles" type="range" min="100" max="2400" value="780" step="20" /><output id="bottleneckTrianglesValue" for="bottleneckTriangles">0.78 M</output></div>
<div class="control-group"><label for="bottleneckFragments">片元 ALU</label><input id="bottleneckFragments" type="range" min="2" max="32" value="10" step="1" /><output id="bottleneckFragmentsValue" for="bottleneckFragments">10 次</output></div>
<div class="control-group"><label for="bottleneckOverdraw">平均 Overdraw</label><input id="bottleneckOverdraw" type="range" min="10" max="60" value="18" step="1" /><output id="bottleneckOverdrawValue" for="bottleneckOverdraw">1.8×</output></div>
<div class="metric-panel"><div><span>主瓶颈</span><strong id="bottleneckStage">片元</strong></div><div><span>估算帧时</span><strong id="bottleneckFrame">8.2 ms</strong></div><div><span>估算 FPS</span><strong id="bottleneckFps">122</strong></div><div><span>GPU 计时器</span><strong id="bottleneckTimer">检测中</strong></div></div></aside>
<section class="single-viewport-grid"><article class="viewport-panel"><div class="panel-heading"><h2>管线阶段时间与负载视图</h2><span>最长时间条决定帧吞吐，底部显示片元负载</span></div><canvas class="webgl-lab-canvas bottleneck-canvas" id="bottleneckCanvas" width="1280" height="720"></canvas><div class="concept-strip bottleneck-stage-strip"><span data-stage="application"><strong>A</strong>应用 / 提交</span><span data-stage="geometry"><strong>G</strong>几何处理</span><span data-stage="fragment"><strong>F</strong>片元着色</span><span data-stage="bandwidth"><strong>B</strong>带宽 / 合并</span></div></article></section></div></section>

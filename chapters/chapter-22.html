<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="逐级检查 BVH、包围盒和三角形射线拾取。" /><title>Chapter 22 相交测试方法 | RTR4 实时图形实验</title><link rel="stylesheet" href="../src/styles.css?v=20260803-11" /></head><body>
<a class="skip-link" href="#main-content">跳到主要内容</a><main class="app-shell" id="main-content"><header class="topbar"><div><p class="eyebrow">Real-Time Rendering 4th</p><h1>Chapter 22 相交测试方法</h1></div><div class="topbar-actions"><a class="status-pill nav-pill" href="../index.html">实验首页</a><a class="status-pill nav-pill" href="../translations/rtr4-cn.html#chapter-22">阅读本章</a></div></header>
<nav class="chapter-nav" data-chapter="22" aria-label="章节实验导航"></nav><section class="experiment-section" id="ray-picking" aria-label="射线拾取检查实验"><div class="section-heading"><p class="eyebrow">Chapter 22</p><h2>射线拾取检查器</h2></div><div class="lab-layout"><aside class="controls" aria-label="拾取射线控制">
<div class="control-group"><label for="pickingStage">检查阶段</label><select id="pickingStage"><option value="bvh">BVH 根节点</option><option value="aabb">候选 AABB</option><option value="triangle">三角形测试</option><option value="result" selected>最近命中结果</option></select></div>
<div class="control-group"><label for="pickingTargetX">射线目标 X</label><input id="pickingTargetX" type="range" min="-90" max="90" value="22" step="1" /><output id="pickingTargetXValue" for="pickingTargetX">+0.22</output></div>
<div class="control-group"><label for="pickingTargetY">射线目标 Y</label><input id="pickingTargetY" type="range" min="-20" max="90" value="58" step="1" /><output id="pickingTargetYValue" for="pickingTargetY">+0.58</output></div>
<div class="control-group"><label for="pickingDepth">BVH 展开深度</label><input id="pickingDepth" type="range" min="0" max="3" value="2" step="1" /><output id="pickingDepthValue" for="pickingDepth">2 层</output></div>
<div class="metric-panel"><div><span>AABB 测试</span><strong id="pickingBoxes">3</strong></div><div><span>三角形测试</span><strong id="pickingTriangles">2</strong></div><div><span>最近命中</span><strong id="pickingHit">Triangle B</strong></div><div><span>射线参数 t</span><strong id="pickingT">1.24</strong></div></div></aside>
<section class="single-viewport-grid"><article class="viewport-panel"><div class="panel-heading"><h2>BVH → AABB → Triangle</h2><span>拖动画布也可移动射线；黄色表示最近命中</span></div><canvas class="webgl-lab-canvas picking-canvas" id="pickingCanvas" width="1280" height="720"></canvas><div class="concept-strip picking-stage-strip"><span data-stage="bvh"><strong>1</strong>层次节点</span><span data-stage="aabb"><strong>2</strong>包围盒候选</span><span data-stage="triangle"><strong>3</strong>精确图元</span><span data-stage="result"><strong>4</strong>最近命中</span></div></article></section></div></section>
</main><script type="module" src="../src/pages/chapter-22.js?v=20260803-10"></script></body></html>
